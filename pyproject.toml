[project]
name = "fleet-agent-mcp"
version = "0.2.3"
description = "Self-evolving AI agent: task orchestration, persistent memory, workflows, identity"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "starlette>=0.40",
    "httpx>=0.28",
    "tzdata>=2024.1",
    "agent-client-protocol>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0,<0.17",
]

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_agent"]

# Non-breaking alias: src/fleet_agent_mcp.py re-exports fleet_agent.server.main
# so `python -m fleet_agent_mcp` works (INSTALL.md documents that name, but the
# shipped package dir stays fleet_agent - renaming it would break NSSM
# command lines, imports, and the MCPB stage).
[tool.hatch.build.targets.wheel.force-include]
"src/fleet_agent_mcp.py" = "fleet_agent_mcp.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]
# console.py embeds an HTML/CSS template - long CSS lines are intentional.
"src/fleet_agent/console.py" = ["E501"]
"src/fleet_agent/mcp/tools/codegen.py" = ["E501"]
"src/fleet_agent/mcp/tools/github.py" = ["E501"]
"src/fleet_agent/server.py" = ["E501"]
"src/fleet_agent/llm_client.py" = ["E501"]
"src/fleet_agent/mcp/tools/contribute.py" = ["E501"]
"src/fleet_agent/mcp/tools/notify.py" = ["E501"]
"src/fleet_agent/mcp/tools/fleet_bridge.py" = ["E501"]
"src/fleet_agent/mcp/tools/scripts.py" = ["E501"]
"src/fleet_agent/engine/sqlite_store.py" = ["E501"]
"src/fleet_agent/coworker/seed.py" = ["E501"]
"src/fleet_agent/coworker/pr_poll.py" = ["E501"]
# Prompt/output fidelity: LLM system prompts and user-facing message strings
# must stay byte-identical (whitespace matters to the model / to parsers).
"src/fleet_agent/mcp/tools/job_finder.py" = ["E501"]
"src/fleet_agent/mcp/tools/memory.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.21.0",
    "pyright>=1.1.411",
    "pytesseract>=0.3.13",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pywin32>=311",
    "pywinauto>=0.6.9",
    "ruff>=0.16.0,<0.17",
]
